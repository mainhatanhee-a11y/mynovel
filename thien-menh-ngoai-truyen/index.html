<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15162a">
<meta name="description" content="Thiên Mệnh Ngoại Truyện: visual novel tu chân, hóa thân thành hệ thống bàn tay vàng.">
<title>Thiên Mệnh Ngoại Truyện ♡ Visual Novel</title>
<link rel="stylesheet" href="./styles.css?v=0.5">
<script defer src="./visuals.js?v=0.5"></script>
<script defer src="./story.js?v=0.5"></script>
<script defer src="./app.js?v=0.5"></script>
</head>
<body>
<div class="app">
  <header class="mast">
    <div class="logo-wrap">
      <span class="logo">命</span>
      <span class="logo-text"><strong>Thiên Mệnh Ngoại Truyện</strong><small>✦ Câu chuyện nằm ngoài trang sách ✦</small></span>
    </div>
    <nav class="tools" aria-label="Công cụ">
      <button id="archiveBtn" type="button" title="Thư viện nguyên tác"><span aria-hidden="true">▤</span><span class="tool-text">Nguyên tác</span></button>
      <button id="journalBtn" type="button" title="Xem hội thoại"><span aria-hidden="true">☷</span><span class="tool-text">Nhật ký</span></button>
      <button id="menuBtn" type="button" title="Mở menu"><span aria-hidden="true">✧</span><span class="tool-text">Menu</span></button>
    </nav>
  </header>
  <main id="stage" class="stage" aria-label="Visual novel">
    <div id="background" class="stage-art" aria-hidden="true"></div>
    <div class="glitter" aria-hidden="true"><span>✧</span><span>✦</span><span>✧</span><span>·</span><span>✦</span></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scene-hud">
      <div class="location"><span class="hud-icon">✦</span><div><small id="chapterText">KÝ ỨC THỨC TỈNH</small><strong id="locationText">Không gian vô định</strong></div></div>
      <div class="status" id="statusLabel">HỆ THỐNG // CHƯA KHẾ ƯỚC</div>
    </div>
    <div id="characterLayer" class="character-layer" aria-hidden="true"></div>
    <div id="sceneContent" class="scene-content" aria-live="polite"></div>
    <div id="dialogueBox" class="dialogue-box hidden" data-tone="narrator">
      <div class="speaker-line"><span id="speakerName" class="speaker-name">Dẫn truyện</span><span id="dialogueProgress" class="dialogue-progress"></span></div>
      <div id="dialogueText" class="dialogue-text" aria-live="off"></div>
      <div class="dialogue-foot"><span class="tap-tip">CHẠM / SPACE ĐỂ TIẾP TỤC</span><button id="nextBtn" class="next-btn" type="button">TIẾP <span>⌄</span></button></div>
    </div>
  </main>
  <footer class="footline"><div><span class="dot"></span><span id="footerText">Một trang sách chưa được viết</span></div><span>CHAPTER ZERO · DEMO 0.5</span></footer>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-shell"><div class="modal-head"><div><span class="micro">◈ THƯ VIỆN HỆ THỐNG</span><h2 id="modalTitle"></h2></div><button id="closeModal" class="close-btn" aria-label="Đóng bảng" type="button">✕</button></div><div class="modal-body" id="modalBody"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Visual novel này cần bật JavaScript để chơi.</noscript>
</body>
</html>
