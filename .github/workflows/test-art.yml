name: Test art asset download
on:
  push:
    paths:
      - '.github/workflows/test-art.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Download thumbnail and full-size variant
        env:
          ASSET_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F7280f3c8-15b5-4549-847b-830785194531/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAG1nzBn28PgQQPxr87ubQtuY0iz8Imcchzb4dqSJv9dk&exp=1794507165&osig=AAAAAAAAAAAAAAAAAAAAAO0Mo7V9A-vd7YTP07wYDMk9qasZcd71-BApzzeZWxV6&signer=media-rpc&token=AAIAAU0AJDcyODBmM2M4LTE1YjUtNDU0OS04NDdiLTgzMDc4NTE5NDUzMQAAAAABodD2TUhXOhUg-KgdOJEx7H27y-JwWrN0ZaXB8PZWySB2wLcB_Q&x-canva-quality=thumbnail'
        run: |
          set -e
          python3 - <<'PY'
          import os,urllib.request,struct
          u=os.environ['ASSET_URL']
          v=u.replace('/height:112/','/height:720/').replace('/width:200','/width:1280').replace('x-canva-quality=thumbnail','x-canva-quality=original')
          for name,url in [('thumb',u),('full_modified',v)]:
            try:
              with urllib.request.urlopen(url,timeout=18) as r:
                b=r.read()
                print(name,'HTTP',r.status,'bytes',len(b),'content-type',r.headers.get('content-type'))
                print(name,'png-size',struct.unpack('>II',b[16:24]) if b[:8]==b'\x89PNG\r\n\x1a\n' else 'not png')
            except Exception as e: print(name,'request error',str(e)[:120])
          PY